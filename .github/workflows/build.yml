name: build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04
strategy:
matrix:
target: [K2P, K2P-NANO]
toolchain: [mipsel-linux-musl]
steps:
- uses: actions/checkout@v3
- uses: hendrikmuhs/ccache-action@v1.2
# 修正了 'with' 的缩进
with:
key: matrix.target−{{ matrix.toolchain }}
- uses: actions/setup-go@v4
# 修正了 'with' 的缩进
with:
go-version: '1.20'
check-latest: true
cache: false
- uses: actions/setup-node@v3
# 修正了 'with' 的缩进
with:
node-version: 18
check-latest: true
- name: Prepare
run: |
sudo apt update
sudo apt install libtool-bin gperf python3-docutils autopoint gettext ccache
- name: Build
run: |
make matrix.targetTOOLCHAIN={{ matrix.toolchain }}
if [ "matrix.target"="K2P−NANO"];thenimage=(ls trunk/images/.trx)
# Rename the file to include -NANO for consistency if needed, though
# the build system usually handles this. Keeping your original logic.
mv $image $(echo $image | sed 's/K2P/K2P-NANO/')
fi
- uses: actions/upload-artifact@v4
with:
# 使用唯一的 Artifact 名称避免 409 Conflict 错误
name: matrix.target−{{ matrix.toolchain }}
path: trunk/images/.trx

publish:
needs: [build]
runs-on: ubuntu-22.04
if: {{ github.ref == 'refs/heads/main' }} steps: - uses: actions/checkout@v3 # Download all artifacts. They will be placed in folders named # K2P-mipsel-linux-musl/ and K2P-NANO-mipsel-linux-musl/. - uses: actions/download-artifact@v3 - name: Set Tag Name run: echo "TAG_ANME=(date +%Y%m%d)" >> $GITHUB_ENV
- uses: rickstaa/action-create-tag@v1
with:
tag: ${{ env.TAG_ANME }}
force_push_tag: true
- uses: ncipollo/release-action@v1
with:
commit: ${{ github.sha }}
tag: ${{ env.TAG_ANME }}
# 使用通配符匹配所有下载的 .trx 文件
artifacts: "-mipsel-linux-musl/.trx"
allowUpdates: true
